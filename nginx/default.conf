# Nanosaur web: static files with correct types, compression and cache rules.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Default MIME map plus the types nginx doesn't always know
	include /etc/nginx/mime.types;
	types {
		application/manifest+json	webmanifest;
		application/octet-stream	data;
	}

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/css application/javascript application/json application/manifest+json
	           application/wasm application/octet-stream image/svg+xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy same-origin always;

	# Always revalidate: the service worker handles offline caching and versioning.
	location / {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri $uri/ /index.html;
	}

	location = /sw.js {
		add_header Cache-Control "no-store" always;
		add_header Service-Worker-Allowed "/" always;
		add_header X-Content-Type-Options nosniff always;
	}

	# Small health endpoint for Docker / Unraid
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
}
